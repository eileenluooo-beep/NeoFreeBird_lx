name: Build download shortcut dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build iOS arm64 dylib
        run: |
          xcodebuild -version
          bash build.sh
      - name: Record build provenance
        run: |
          printf '%s\n' "$GITHUB_SHA" > build/source-commit.txt
          xcodebuild -version > build/xcode-version.txt
          cp README.md build/
      - name: Upload dylib
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NFBActionBarDownload-arm64
          path: build/
          if-no-files-found: error
          retention-days: 14
